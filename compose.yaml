services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: willow
      POSTGRES_PASSWORD: willow
      POSTGRES_DB: willow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U willow -d willow"]
      interval: 2s
      timeout: 5s
      retries: 20
