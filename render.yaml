services:
  - type: web
    name: willow-clinic-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_KEY
        sync: false
      - key: DB_PATH
        value: /opt/render/project/src/data/clinic.db
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: LOG_LEVEL
        value: info
